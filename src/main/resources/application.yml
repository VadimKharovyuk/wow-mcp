spring:
  application:
    name: wow-mcp
  config:
    # Секреты Telegram лежат вне git: ./telegram.local.properties (рядом, откуда запущен jar) или
    # ~/.wow-mcp/telegram.properties; можно и переменными WOW_TELEGRAM_TOKEN / WOW_TELEGRAM_ALLOWED_CHAT_IDS.
    import: optional:file:./telegram.local.properties,optional:file:${user.home}/.wow-mcp/telegram.properties
  main:
    # Это stdio MCP-сервер: никакого веб-сервера и баннера в stdout.
    web-application-type: none
    banner-mode: "off"
  ai:
    mcp:
      server:
        name: wow-mcp
        version: 0.0.1
        stdio: true
        type: SYNC
        instructions: >-
          Управление персонажем в LastHavens (WoW 3.3.5 в браузере).
          Начинай с get_state, затем используй go_to/move_to/fight/rest/loot
          и wait_job для ожидания результата. После боя вызывай loot.
          Координаты — в диапазоне 0–100. Ротацию умений можно задать через set_rotation.

wow:
  # Chrome должен быть запущен с --remote-debugging-port=9222
  cdp-url: http://localhost:9222
  page-url-contains: lasthavens.com/play
  db:
    url: jdbc:postgresql://localhost:5432/wow_bot
    username: vadim
    password: ""
  # Автообучение ротации выключено: ротация меняется только по команде «переучи ротацию»
  # (ручной learn_rotation работает всегда).
  learn:
    disabled-profiles: paladin,hunter
